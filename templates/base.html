<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | SmartCart Customer Segmentation</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="brand-logo">
                <div class="brand-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div class="brand-text">Smart<span>Cart</span></div>
            </a>
            
            <nav>
                <ul class="nav-links">
                    <li>
                        <a href="{{ url_for('home') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">
                            <i class="fa-solid fa-house"></i> Home
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('analysis') }}" class="nav-link {% if request.path == '/analysis' %}active{% endif %}">
                            <i class="fa-solid fa-chart-pie"></i> ML Analysis
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('segmentation') }}" class="nav-link {% if request.path == '/segmentation' %}active{% endif %}">
                            <i class="fa-solid fa-users-viewfinder"></i> Live Segmentation
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p><strong>SmartCart</strong> — E-Commerce Customer Segmentation System</p>
            <p>Powered by Flask, Scikit-Learn & Unsupervised Machine Learning</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
